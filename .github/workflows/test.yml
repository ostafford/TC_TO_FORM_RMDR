# Typecheck and the test suite on every push and pull request (#87).
# test:integration stays out: it needs a real Connecteam API key.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      # The setup wizard's tests drive scripts/setup-wizard.sh, which needs both.
      - run: bash --version | head -1 && perl -v | sed -n 2p
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
